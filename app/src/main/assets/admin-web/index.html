<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Wallpaper Platform - Production Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: {
              900: '#0F1115',
              800: '#16191E',
              700: '#1E222A',
              600: '#2B303B'
            },
            champagne: {
              DEFAULT: '#D4AF37',
              light: '#E5C866',
              dark: '#A6841C'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0F1115; }
    ::-webkit-scrollbar-thumb { background: #2B303B; border-radius: 3px; }
  </style>
</head>
<body class="bg-obsidian-900 text-slate-100 min-h-screen flex antialiased">
  <aside id="sidebar" class="w-64 bg-obsidian-800 border-r border-obsidian-600 flex flex-col justify-between p-4 flex-shrink-0">
    <div>
      <div class="flex items-center gap-3 px-2 py-3 border-b border-obsidian-600 mb-6">
        <div class="w-9 h-9 rounded-lg bg-champagne/10 border border-champagne/30 flex items-center justify-center text-champagne">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-wider text-champagne">LIVE WALLPAPER</h1>
          <p class="text-xs text-slate-400">Production Admin</p>
        </div>
      </div>
      <nav class="space-y-1">
        <button class="nav-btn active flex items-center gap-3 w-full px-3 py-2.5 rounded-md text-sm font-medium transition text-champagne bg-champagne/10 border border-champagne/20">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
        </button>
      </nav>
    </div>
    <div class="border-t border-obsidian-600 pt-4 flex items-center justify-between">
      <div>
        <p class="text-xs font-semibold text-white">Sarah Vance</p>
        <span class="inline-block px-1.5 py-0.5 text-[10px] font-bold rounded bg-champagne/10 text-champagne border border-champagne/30">SUPER_ADMIN</span>
      </div>
    </div>
  </aside>
  <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
    <header class="h-16 bg-obsidian-800 border-b border-obsidian-600 px-6 flex items-center justify-between sticky top-0 z-10">
      <h2 class="text-base font-bold text-white tracking-wide">Platform Dashboard</h2>
      <div class="flex items-center gap-2 px-3 py-1 rounded bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-medium">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        Supabase + R2 Connected
      </div>
    </header>
    <div class="p-6">
      <p class="text-sm text-slate-400">Production Control Center running in secure standalone sandbox.</p>
    </div>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
